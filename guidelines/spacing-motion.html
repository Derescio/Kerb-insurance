<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Quick ease-out; spring only on toggles" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-surface);color:var(--fg-1);font-family:var(--font-body)}.m{font:500 11px/15px var(--font-mono);color:var(--fg-3)}.n{font:600 13px/18px var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="border:1px solid var(--border-1);border-radius:12px;padding:14px"><div class="n">--dur-fast · 120ms</div><div style="font-size:13px;color:var(--fg-2);margin-top:4px">hover, press, colour</div><div class="m" style="margin-top:8px">ease-out</div></div><div style="border:1px solid var(--border-1);border-radius:12px;padding:14px"><div class="n">--dur-base · 200ms</div><div style="font-size:13px;color:var(--fg-2);margin-top:4px">tabs, switches, fades</div><div class="m" style="margin-top:8px">ease-out / spring</div></div><div style="border:1px solid var(--border-1);border-radius:12px;padding:14px"><div class="n">--dur-slow · 320ms</div><div style="font-size:13px;color:var(--fg-2);margin-top:4px">dialogs, sheets, toasts</div><div class="m" style="margin-top:8px">ease-out</div></div></div><div class="m" style="margin-top:14px">Press = scale(.98). No bounces on content, no parallax. Respect prefers-reduced-motion.</div></body></html>
