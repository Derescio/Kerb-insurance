<!-- @dsCard group="Colors" viewport="700x190" name="Status" subtitle="Success, warning, danger, info — fg / bg / border" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-surface);color:var(--fg-1);font-family:var(--font-body)}.m{font:500 11px/15px var(--font-mono);color:var(--fg-3)}.n{font:600 13px/18px var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="border-radius:12px;background:var(--success-bg);border:1px solid var(--success-border);padding:14px"><div style="width:28px;height:28px;border-radius:50%;background:var(--success)"></div><div class="n" style="margin-top:12px;color:var(--success)">Success</div><div style="font-size:12px;line-height:16px;color:var(--fg-2);margin-top:2px">Covered, paid, approved</div><div class="m" style="margin-top:8px">--success</div></div><div style="border-radius:12px;background:var(--warning-bg);border:1px solid var(--warning-border);padding:14px"><div style="width:28px;height:28px;border-radius:50%;background:var(--warning)"></div><div class="n" style="margin-top:12px;color:var(--warning)">Warning</div><div style="font-size:12px;line-height:16px;color:var(--fg-2);margin-top:2px">Renewal due, docs needed</div><div class="m" style="margin-top:8px">--warning</div></div><div style="border-radius:12px;background:var(--danger-bg);border:1px solid var(--danger-border);padding:14px"><div style="width:28px;height:28px;border-radius:50%;background:var(--danger)"></div><div class="n" style="margin-top:12px;color:var(--danger)">Danger</div><div style="font-size:12px;line-height:16px;color:var(--fg-2);margin-top:2px">Payment failed, declined</div><div class="m" style="margin-top:8px">--danger</div></div><div style="border-radius:12px;background:var(--info-bg);border:1px solid var(--info-border);padding:14px"><div style="width:28px;height:28px;border-radius:50%;background:var(--info)"></div><div class="n" style="margin-top:12px;color:var(--info)">Info</div><div style="font-size:12px;line-height:16px;color:var(--fg-2);margin-top:2px">Tips, neutral updates</div><div class="m" style="margin-top:8px">--info</div></div></div></body></html>
