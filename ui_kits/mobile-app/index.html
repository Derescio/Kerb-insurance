<!doctype html><html><head><meta charset="utf-8"><title>Kerb — mobile app</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;height:100%}body{background:var(--stone-200);display:grid;place-items:center;min-height:940px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="PolicyScreen.jsx"></script>
<script type="text/babel" src="ClaimsScreens.jsx"></script>
<script type="text/babel" src="ClaimFlow.jsx"></script>
<script type="text/babel" src="AccountScreen.jsx"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Toast } = window.KerbDesignSystem_549f9e;
function MobileApp() {
  const [screen, setScreen] = React.useState('home');
  const [tab, setTab] = React.useState('home');
  const [toast, setToast] = React.useState(null);
  const [claims, setClaims] = React.useState([
    { ref: 'KRB-C-20931', title: 'Rear bumper repair', date: '21 Sep', open: true },
    { ref: 'KRB-C-17402', title: 'Windscreen chip', date: '3 Feb', open: false },
  ]);
  const go = (s) => { setScreen(s); if (['home', 'policy', 'claims', 'account'].includes(s)) setTab(s); };
  const open = claims.find((c) => c.open);
  const submit = (title) => {
    const c = { ref: 'KRB-C-' + (21000 + Math.floor(Math.random() * 900)), title, date: '24 Sep', open: true };
    setClaims([c, ...claims]); setScreen('tracker'); setToast(c.ref);
    setTimeout(() => setToast(null), 5000);
  };
  let body;
  if (screen === 'flow') body = <ClaimFlow onClose={() => go(tab)} onSubmit={submit} />;
  else if (screen === 'tracker') body = <Screen><TrackerScreen back={() => go(tab)} claim={open} /></Screen>;
  else body = (
    <Screen footer={<TabBar tab={tab} onTab={go} />}>
      {screen === 'home' ? <HomeScreen go={go} claim={open} /> : screen === 'policy' ? <PolicyScreen /> : screen === 'claims' ? <ClaimsScreen go={go} claims={claims} /> : <AccountScreen />}
    </Screen>
  );
  return (
    <IOSDevice>
      <div style={{ height: '100%', position: 'relative' }} data-screen-label={screen}>
        {body}
        {toast ? <div style={{ position: 'absolute', left: 16, right: 16, bottom: 40, display: 'flex', justifyContent: 'center', zIndex: 60 }}><Toast title="Claim submitted" message={'Reference ' + toast} onClose={() => setToast(null)} /></div> : null}
      </div>
    </IOSDevice>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp />);
</script></body></html>
